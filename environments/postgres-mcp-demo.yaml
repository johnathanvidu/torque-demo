spec_version: 2

labels:
  - kubernetes
  - postgres
  - mcp

environment:
  environment_name: postgres-mcp-demo
  owner_email: johnathan.v@quali.com
  state: inactive
  description: Deploys PostgreSQL (postgres ns) and the PostgreSQL MCP server (mcp ns) into the agent's Kubernetes cluster. The MCP server's connection URI is calculated dynamically from the Postgres deployment and wired in.

inputs:
  # Must be a Kubernetes agent residing in the target cluster.
  # TODO: replace with your actual Torque Kubernetes agent name.
  k8s_agent:
    type: string
    default: k8s-agent
    description: Name of the Kubernetes agent (and runner cluster) to deploy into.
  local_port:
    type: string
    default: '8000'
    description: >-
      Local port the environment's port-forward / claude mcp add commands use. The
      in-cluster side is unaffected. Bump this (to 8001, and so on) when you want a
      second copy of this environment tunnelled to your laptop at the same time — it
      is the only thing left that two concurrent copies still contend for.

grains:
  postgres:
    kind: blueprint
    spec:
      source:
        store: torque-demo
        path: blueprints/postgres.yaml
      inputs:
        - agent: '{{ .inputs.k8s_agent }}'
        - namespace: postgres
      outputs:
        - database_uri
        - postgres_host
        - postgres_port
        - postgres_database
        - postgres_user

  mcp:
    kind: blueprint
    depends-on: postgres
    spec:
      source:
        store: torque-demo
        path: blueprints/postgres-mcp.yaml
      inputs:
        - agent: '{{ .inputs.k8s_agent }}'
        - database_uri: '{{ .grains.postgres.outputs.database_uri }}'
        # Read-only by default. Flip to 'unrestricted' to let an agent write.
        - access_mode: restricted
        - local_port: '{{ .inputs.local_port }}'
      outputs:
        - mcp_endpoint
