spec_version: 2

labels:
  - Hyperscaler: AWS

environment:
  environment_name: ec2-replace-demo
  owner_email: johnathan.v@quali.com
  state: active
  description: An environment to demonstrate starting and stopping EC2 instances with Torque.

inputs:
  prefix:
    type: string
    default: ec2-demo
    description: Prefix for all resources created in this environment, to ensure uniqueness.

grains:
  vpc:
    kind: blueprint
    spec:
      source:
        store: torque-demo
        path: blueprints/aws-vpc.yaml
      inputs:
        - agent: vido-vido-prod
        - name: '{{ .inputs.prefix }}-vpc'
        - cidr_block: 10.5.0.0/16
      outputs:
        - vpc_id
        - subnet_id
  ec2:
    kind: terraform
    spec:
      source:
        store: torque-demo
        path: terraform/aws/ec2
      agent:
        name: vido-vido-prod
      inputs:
        - instance_name: '{{ .inputs.prefix }}-ec2'
        - instance_type: t3.micro
        - subnet_id: '{{ .grains.vpc.outputs.subnet_id }}'
        - vpc_id: '{{ .grains.vpc.outputs.vpc_id }}'
        - security_group_ids: '[]'
        - ssh_ingress_cidrs: '["0.0.0.0/0"]'
      outputs:
        - instance_id
        - public_ip
        - private_ip
        - key_pair_name