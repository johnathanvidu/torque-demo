spec_version: 2
description: 'Re-run the environment''s health_check grain via the Torque API so the kafka_health / health_summary outputs reflect the pipeline right now. Read-only — it refreshes the verdict, it does not remediate.'

workflow:
  scope: env
  labels-selector: kafka
  triggers:
    - type: manual
    # Poll every 5 minutes so the environment's kafka_health output is never
    # more than one interval stale — the environment page becomes the status
    # board instead of the dashboard.
    #
    # Left commented out on purpose: until this runs manually and green a few
    # times, a cron would just fail on a schedule. Uncomment to arm it.
    # - type: cron
    #   cron: '*/5 * * * *'
    #   overridable: true
  timeout: 10

inputs:
  agent:
    type: agent
    description: Torque agent that issues the API call. Needs outbound HTTPS to the Torque portal.

grains:
  refresh_health:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      env-vars:
        - TORQUE_URL: 'https://portal.qtorque.io'
        - SPACE: '{{ spaceName }}'
        - ENV_ID: '{{ .bindings.environment_id }}'
        - GRAIN: 'health_check'
        # Torque API token, read from the space's parameter store so it is never
        # in this file and never prompted for (a prompt would block the cron).
        # Lives under Settings -> Parameters as `TORQUE_TOKEN`.
        - TORQUE_TOKEN: '{{ .params.TORQUE_TOKEN }}'
      activities:
        deploy:
          commands:
            - |
              set -euo pipefail

              ENV_URL="$TORQUE_URL/api/spaces/$SPACE/environments/$ENV_ID"
              AUTH="Authorization: Bearer $TORQUE_TOKEN"

              echo "== Re-running grain '$GRAIN' in $SPACE/$ENV_ID =="

              # Preflight against the one endpoint that is confirmed. If this
              # succeeds and the POST below does not, then the token, space and
              # env id are all fine and the problem is purely the update path.
              PRE=$(curl -sS -o /tmp/pre.json -w '%{http_code}' "$ENV_URL" -H "$AUTH")
              if [ "$PRE" -ge 300 ]; then
                echo "Cannot even read the environment (HTTP $PRE) — check the TORQUE_TOKEN parameter." >&2
                cat /tmp/pre.json >&2 || true
                exit 1
              fi
              echo "Auth OK (environment readable)."

              # ---- readers over the environment payload -------------------
              # The payload nests things differently across API versions, and a
              # grain's `state` is an OBJECT ({current_state, stages, ...}) on
              # the v2 shape but a bare string on older ones. Every reader below
              # therefore probes both shapes and normalises to lower case, so
              # comparisons never hinge on "active" vs "Active With Error".
              norm() { tr '[:upper:]' '[:lower:]' | tr -d ' _-'; }

              grain_json() {
                jq --arg g "$GRAIN" \
                  'first(((.details.state.grains // .grains // [])[] | select(.path == $g))) // {}' \
                  /tmp/env.json
              }
              # `state` as a string, whichever shape it arrived in.
              grain_state() {
                grain_json | jq -r '.state | if type == "object" then (.current_state // "unknown") else (. // "unknown") end'
              }
              # Fingerprint of the grain's last Deploy stage: count + id + start.
              # A re-run appends a stage (count moves) or re-executes one in
              # place (id/start moves) — either way this string changes, which is
              # how a finished NEW run is told apart from the still-terminal
              # state of the PREVIOUS one. Without it the first poll can observe
              # the old "Deployed"/"DeployFailed" and report stale outputs.
              grain_stages() {
                grain_json | jq -r '
                  (.state | if type == "object" then (.stages // []) else [] end) as $s
                  | "\($s | length):\($s[-1].id // "-"):\($s[-1].execution.start // "-")"'
              }
              output_of() {
                jq -r --arg n "$1" \
                  '(.details.state.outputs // .outputs // []) as $o
                   | if ($o | type) == "object" then ($o[$n] // empty)
                     else (first($o[] | select(.name == $n) | .value) // empty) end' \
                  /tmp/env.json
              }

              # Fingerprint the grain's last stage BEFORE the update, so the poll
              # below can require a genuinely new run rather than trust a timer.
              curl -sS -o /tmp/env.json "$ENV_URL" -H "$AUTH"
              STAGES_BEFORE=$(grain_stages)
              echo "Grain '$GRAIN' currently at state=$(grain_state), stage=$STAGES_BEFORE."

              # A payload that reports `state` as a bare string carries no stages
              # to fingerprint. There the terminal state alone has to do, so fall
              # back to waiting long enough for the update to have taken hold.
              case "$STAGES_BEFORE" in 0:*) HAVE_STAGES=no ;; *) HAVE_STAGES=yes ;; esac

              # Torque's "Updates" feature — "triggering a restart of the grain
              # (essentially redeploying it) without making any alterations"
              # (docs.qtorque.io/environment-services/drift-and-update).
              #
              # A grain entry carrying only `path` means exactly that: no new
              # commit, no new inputs, just re-run it. The body supports far more
              # (branch/commit_hash/tag, inputs, grains_to_add, grains_to_remove,
              # force, ...) — all omitted deliberately, since any of them would
              # turn this read-only refresh into a real change.
              #
              # Nothing in the blueprint depends on health_check, so Torque's
              # rolling update has no dependents to cascade to: this re-runs the
              # health check alone and leaves MSK and the app untouched.
              UPDATE_URL="$ENV_URL/update_v2"
              jq -n --arg grain "$GRAIN" '{grains: [{path: $grain}]}' > /tmp/payload.json

              # Payload is built by jq rather than inline: \" escapes do not
              # survive the YAML -> shell hop and collapse into invalid JSON.
              echo "POST $UPDATE_URL"
              echo "  payload: $(cat /tmp/payload.json)"

              HTTP_CODE=$(curl -sS -o /tmp/update.json -w '%{http_code}' \
                -X POST "$UPDATE_URL" \
                -H "$AUTH" \
                -H 'Content-Type: application/json' \
                --data @/tmp/payload.json)

              if [ "$HTTP_CODE" -ge 300 ]; then
                echo "Torque API returned HTTP $HTTP_CODE for POST $UPDATE_URL" >&2
                echo "Response body:" >&2
                cat /tmp/update.json >&2 || true
                echo >&2
                exit 1
              fi
              echo "Update accepted (HTTP $HTTP_CODE)."

              # Give Torque a moment to register the update, then poll. The exit
              # condition is "the grain's stage differs from the baseline AND has
              # reached a terminal state" — the fingerprint rules out the previous
              # run, so no timer has to be trusted for correctness.
              echo "== Waiting for the grain to finish =="
              if [ "$HAVE_STAGES" = yes ]; then sleep 5; else sleep 20; fi

              DONE=no
              for _ in $(seq 1 24); do
                curl -sS -o /tmp/env.json "$ENV_URL" -H "$AUTH"
                GSTATE=$(grain_state); STAGES=$(grain_stages)
                echo "  grain=$GSTATE  stage=$STAGES (was $STAGES_BEFORE)"

                # A grain that failed is a terminal, reportable outcome here:
                # health_check exits non-zero when the pipeline is unhealthy, so
                # DeployFailed is a verdict, not a workflow error.
                case "$(printf '%s' "$GSTATE" | norm)" in
                  deployed | *failed | *error | terminated | ended)
                    if [ "$HAVE_STAGES" != yes ] || [ "$STAGES" != "$STAGES_BEFORE" ]; then
                      DONE=yes; break
                    fi
                    ;;
                esac
                sleep 10
              done

              if [ "$DONE" != yes ]; then
                echo "Grain '$GRAIN' did not report a finished re-run within the poll window;" >&2
                echo "the outputs below may be from the previous evaluation." >&2
              else
                # Env-level outputs are republished just after the grain settles.
                sleep 5
                curl -sS -o /tmp/env.json "$ENV_URL" -H "$AUTH"
              fi

              GSTATE=$(grain_state)
              HEALTH=$(output_of kafka_health)
              SUMMARY=$(output_of health_summary)
              COUNT=$(output_of messages_processed)

              echo "== Kafka health: ${HEALTH:-unknown}, messages processed: ${COUNT:-?} =="
              if [ -n "$SUMMARY" ]; then echo "$SUMMARY"; fi
              case "$(printf '%s' "$GSTATE" | norm)" in
                *failed | *error)
                  echo "Health check grain ended in '$GSTATE' — the pipeline is failing its own"
                  echo "assertions. See the grain's Deploy log for the assertion that tripped."
                  ;;
              esac

              # This workflow reports the pipeline's condition; it does not change
              # it — a failing health check is a finding, not a workflow error.
              exit 0
