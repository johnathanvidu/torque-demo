spec_version: 2
description: "Boot sequence by Azure VM tag: start the priority VM (bootSequence=1) first, then every other stopped VM, then the NetApp CVOs. Selection by shell script, power by the built-in torque-actions."

workflow:
  scope: env
  labels-selector: "Hyperscaler:Azure"
  triggers:
    - type: manual
    # The built-in azure-vm-power-on-env workflow already owns the 08:00 cron.
    # Uncomment here (and remove it there) to switch the schedule to the sequenced start.
    # - type: cron
    #   cron: '0 8 * * *' # every day at 08:00 UTC
    #   overridable: true
    
inputs:
  agent:
    type: agent
    description: Torque agent that runs the selection script and the built-in power actions. Needs Azure control-plane access.
  tag_key:
    type: string
    default: bootSequence
    description: Tag key used to select VMs
  tag_value:
    type: string
    default: "1"
    description: Priority tag value; VMs with this value are handled first
  resource_type:
    type: string
    default: azurerm_virtual_machine
    description: Resource type(s) searched inside binding-context resources. Comma-separated for more than one.
  enforce_priority_boot:
    type: string
    default: "false"
    allowed-values:
      - "true"
      - "false"
    description: Set to "true" to fail the workflow when no inactive priority VM is found

grains:
  select_vms:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      files:
        - source: torque-demo
          path: scripts/filter-azure-vm-by-tags.sh
      activities:
        deploy:
          commands:
            - name: filter-priority
              command: >-
                chmod +x filter-azure-vm-by-tags.sh &&
                . ./filter-azure-vm-by-tags.sh
                --tag-key '{{ .inputs.tag_key }}'
                --tag-value '{{ .inputs.tag_value }}'
                --resource-type '{{ .inputs.resource_type }}'
                --match-operator eq
                --select first
                --inactive-only
                $([ '{{ .inputs.enforce_priority_boot }}' = 'true' ] && echo '--require-match')
              outputs:
                - vms_json
            - name: filter-secondary
              command: >-
                chmod +x filter-azure-vm-by-tags.sh &&
                . ./filter-azure-vm-by-tags.sh
                --tag-key '{{ .inputs.tag_key }}'
                --tag-value '{{ .inputs.tag_value }}'
                --resource-type '{{ .inputs.resource_type }}'
                --match-operator ne
                --select all
                --inactive-only
              outputs:
                - vms_json

  # ---------------------------------------------------------------- power, in order

  handle_priority_vms:
    kind: ansible
    depends-on: select_vms
    when: '{% if .grains.select_vms.activities.deploy.commands.filter-priority.outputs.vms_json != "[]" and .grains.select_vms.activities.deploy.commands.filter-priority.outputs.vms_json != "" and .grains.select_vms.activities.deploy.commands.filter-priority.outputs.vms_json != null %} true {% else %} false {% endif %}'
    spec:
      source:
        path: https://github.com/QualiTorque/torque-actions.git//resource/azure-power-on-vm-tf.yaml
      built-in: true
      agent:
        name: '{{ .inputs.agent }}'
      env-vars:
        - TORQUE_REQUESTED_RESOURCES: '{{ .grains.select_vms.activities.deploy.commands.filter-priority.outputs.vms_json }}'

  handle_secondary_vms:
    kind: ansible
    depends-on: handle_priority_vms
    when: '{% if .grains.select_vms.activities.deploy.commands.filter-secondary.outputs.vms_json != "[]" and .grains.select_vms.activities.deploy.commands.filter-secondary.outputs.vms_json != "" and .grains.select_vms.activities.deploy.commands.filter-secondary.outputs.vms_json != null %} true {% else %} false {% endif %}'
    spec:
      source:
        path: https://github.com/QualiTorque/torque-actions.git//resource/azure-power-on-vm-tf.yaml
      built-in: true
      agent:
        name: '{{ .inputs.agent }}'
      env-vars:
        - TORQUE_REQUESTED_RESOURCES: '{{ .grains.select_vms.activities.deploy.commands.filter-secondary.outputs.vms_json }}'