# Applies the requested power state to every VM in a single bootSequence tier, then waits
# for the tier to actually reach that state before returning.
# Included once per tier, in order, by ansible/azure/vm-boot-sequence.yaml.
#
# The Authorization header is not hidden with no_log here, unlike the token request in the
# parent playbook: seeing per-VM request/response detail is what makes a failed power
# operation diagnosable, and the bearer token is short lived. The long-lived credential
# (the federated assertion) never appears in these tasks.

- name: "Select the VMs in tier {{ tier }}"
  ansible.builtin.set_fact:
    tier_vms: "{{ sequenced_vms | selectattr('sequence', 'equalto', tier | int) | list }}"

- name: "Tier {{ tier }}"
  ansible.builtin.debug:
    msg: "{{ boot_sequence_tag }}={{ tier }}: {{ power_action }} {{ tier_vms | map(attribute='name') | join(', ') }}"

# start allocates and boots. deallocate (rather than a plain stop) releases the compute,
# so billing stops too - a stopped-but-allocated VM still bills.
- name: "Request {{ power_action }} for the VMs in tier {{ tier }}"
  ansible.builtin.uri:
    url: "{{ arm_base }}{{ item.id }}/{{ 'start' if power_action == 'start' else 'deallocate' }}?api-version={{ arm_api_version }}"
    method: POST
    headers:
      Authorization: "Bearer {{ arm_token }}"
    status_code: [200, 202]
  loop: "{{ tier_vms }}"
  loop_control:
    label: "{{ item.name }}"

# ARM returns 202 immediately, so the tier is not finished until instanceView agrees.
# Without this wait the tier barrier would be meaningless - tier 2 would start while
# tier 1 was still booting.
- name: "Wait for tier {{ tier }} to reach {{ target_power_code }}"
  ansible.builtin.uri:
    url: "{{ arm_base }}{{ item.id }}/instanceView?api-version={{ arm_api_version }}"
    method: GET
    headers:
      Authorization: "Bearer {{ arm_token }}"
    status_code: 200
  loop: "{{ tier_vms }}"
  loop_control:
    label: "{{ item.name }}"
  register: power_state
  until: target_power_code in (power_state.json.statuses | default([]) | map(attribute='code') | list)
  retries: "{{ power_wait_retries }}"
  delay: "{{ power_wait_delay }}"

- name: "Settle after tier {{ tier }}"
  ansible.builtin.pause:
    seconds: "{{ tier_settle_seconds | int }}"
  when:
    - (tier_settle_seconds | int) > 0
    - tier != (tiers | last)
