# Minimal Grafana chart values. Overridden by the Torque helm grain inputs.

# --- Instance naming ---------------------------------------------------------
# Suffix appended to every resource name this chart creates, so the chart can be
# installed more than once into the SAME namespace. The Torque blueprint sets
# this to the environment id; leave it blank for a plain `helm install` and the
# release name is used instead. See templates/_helpers.tpl.
instance: ""
# Escape hatches, both blank by default: nameOverride replaces the "grafana"
# stem, fullnameOverride replaces the computed name outright.
nameOverride: ""
fullnameOverride: ""

image:
  repository: grafana/grafana
  tag: "11.3.0"
  pullPolicy: IfNotPresent

replicas: 1

# Admin credentials. The MCP server can authenticate with these (basic auth),
# but the demo's primary path is a service-account token generated post-install.
adminUser: admin
adminPassword: admin

service:
  # Port the in-cluster Service listens on. The container always serves on 3000.
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
