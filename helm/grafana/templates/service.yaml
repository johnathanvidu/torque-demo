apiVersion: v1
kind: Service
metadata:
  # Name carries the instance suffix, so several Grafanas can share a namespace
  # and each still gets its own deterministic DNS record:
  #   http://<chart>-<instance>.<namespace>.svc.cluster.local:<port>
  # The blueprint's grafana_url output builds the same string.
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "grafana.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
