# postgres-mcp chart values. Overridden by the Torque helm grain inputs — in
# particular databaseUri, which is computed at deploy time by the Postgres
# blueprint and wired in via the environment.

# --- Instance naming ---------------------------------------------------------
# Suffix appended to every resource name this chart creates, so the chart can be
# installed more than once into the SAME namespace. The Torque blueprint sets
# this to the environment id; leave it blank for a plain `helm install` and the
# release name is used instead. See templates/_helpers.tpl.
instance: ""
# Escape hatches, both blank by default: nameOverride replaces the "postgres-mcp"
# stem, fullnameOverride replaces the computed name outright.
nameOverride: ""
fullnameOverride: ""

image:
  repository: crystaldba/postgres-mcp
  # Pinned, not "latest": the CLI surface changes between releases and the
  # transport flags below are version-specific. 0.3.0 is the newest published
  # tag (and is what "latest" currently points at).
  tag: "0.3.0"
  pullPolicy: IfNotPresent

replicas: 1

# --- Required for the MCP server to reach Postgres ---
# Full libpq connection URI, e.g.
#   postgresql://torque:torque@postgres.postgres.svc.cluster.local:5432/torquedemo
# Wired from the Postgres grain output. Read from a Secret at runtime, since the
# password is embedded in it.
databaseUri: ""

# --- SQL safety ---
# restricted   => read-only transactions plus query-shape protections
# unrestricted => full read/write. The container default is unrestricted; this
#                 chart defaults to restricted so an agent with the endpoint
#                 can't drop a table by accident.
accessMode: "restricted"

# --- Server transport config ---
# postgres-mcp 0.3.0 only implements "stdio" and "sse" (`--transport` rejects
# anything else, and there are no --streamable-http-* flags). stdio is not usable
# in k8s, so SSE it is: the stream is served on /sse and clients POST back to
# /messages. Do not set this to streamable-http until an image that supports it
# ships.
transport: "sse"
# Port the MCP server listens on inside the pod and the Service exposes.
port: 8000
# The server binds this address. MUST be 0.0.0.0 — postgres-mcp defaults
# --sse-host to "localhost", which only accepts in-pod loopback traffic and is
# therefore unreachable through a k8s Service.
bindHost: "0.0.0.0"

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
