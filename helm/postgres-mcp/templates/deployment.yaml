apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp
  labels:
    app: postgres-mcp
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: postgres-mcp
  template:
    metadata:
      labels:
        app: postgres-mcp
      annotations:
        # Roll the pod when the connection URI changes — a Secret-only update
        # leaves the running pod pointed at the old database.
        checksum/db: {{ .Values.databaseUri | sha256sum }}
    spec:
      containers:
        - name: postgres-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # postgres-mcp 0.3.0 flags: --transport {stdio,sse} with --sse-host /
          # --sse-port. It has no --streamable-http-* flags and argparse rejects
          # --transport streamable-http outright (exit code 2, CrashLoopBackOff).
          args:
            - "--transport"
            - "{{ .Values.transport }}"
            - "--sse-host"
            - "{{ .Values.bindHost }}"
            - "--sse-port"
            - "{{ .Values.port }}"
            - "--access-mode"
            - "{{ .Values.accessMode }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            # The connection URI is also accepted as a positional argument, but it
            # carries the password — keep it in a Secret rather than in the pod's
            # command line, where `kubectl get pod -o yaml` would print it.
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-mcp-auth
                  key: databaseUri
          # TCP probes, not httpGet: the SSE endpoint is /sse and a bare GET on it
          # opens a long-lived event stream rather than returning a 2xx body, so an
          # httpGet probe is a poor fit. postgres-mcp exposes no health path.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-mcp-auth
  labels:
    app: postgres-mcp
type: Opaque
stringData:
  databaseUri: "{{ .Values.databaseUri }}"
