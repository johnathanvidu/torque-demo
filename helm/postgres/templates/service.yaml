apiVersion: v1
kind: Service
metadata:
  # Fixed name so the in-cluster DNS is deterministic:
  #   postgres.<namespace>.svc.cluster.local:<port>
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
