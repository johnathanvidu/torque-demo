apiVersion: v1
kind: Service
metadata:
  # Name carries the instance suffix, so several databases can share a namespace
  # and each still gets its own deterministic DNS record:
  #   <chart>-<instance>.<namespace>.svc.cluster.local:<port>
  # The blueprint's database_uri / postgres_host outputs build the same string.
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
