{{- $fullname := include "grafana-mcp.fullname" . -}}
{{/*
Host header allowlist, computed rather than hardcoded: the in-cluster names
depend on the instance suffix and the release namespace, so a fixed list would
only ever be right for one deployment. Both the bare Service name and the FQDN
are listed, each with and without the port, because mcp-grafana matches the full
Host header — which includes the port whenever the client dials a non-default
one. extraAllowedHosts adds the localhost:<local port> variants a
`kubectl port-forward` client sends.
*/}}
{{- $hosts := list
      (printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace)
      (printf "%s.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.port)
      $fullname
      (printf "%s:%v" $fullname .Values.port) -}}
{{- with .Values.extraAllowedHosts }}
{{- $hosts = concat $hosts (splitList "," .) -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "grafana-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana-mcp.labels" . | nindent 8 }}
    spec:
      containers:
        - name: grafana-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-t"
            - "{{ .Values.transport }}"
            - "--address"
            - "{{ .Values.bindAddress }}:{{ .Values.port }}"
            - "--allowed-hosts"
            - "{{ join "," $hosts }}"
            - "--endpoint-path"
            - "{{ .Values.endpointPath }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: GRAFANA_URL
              value: "{{ .Values.grafanaUrl }}"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-auth
                  key: serviceAccountToken
          # TCP probes, not httpGet: the kubelet sends HTTP probes with
          # Host: <podIP>, which mcp-grafana's --allowed-hosts check rejects
          # (the pod IP can't be in the allowlist). A TCP check has no Host
          # header, so it validates the server is listening without tripping the
          # host allowlist, and doesn't depend on the /healthz path existing.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-auth
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  serviceAccountToken: "{{ .Values.serviceAccountToken }}"
