# grafana-mcp chart values. Overridden by the Torque helm grain inputs — in
# particular grafanaUrl and serviceAccountToken are computed at deploy time by
# the Grafana blueprint and wired in via the environment.

# --- Instance naming ---------------------------------------------------------
# Suffix appended to every resource name this chart creates, so the chart can be
# installed more than once into the SAME namespace. The Torque blueprint sets
# this to the environment id; leave it blank for a plain `helm install` and the
# release name is used instead. See templates/_helpers.tpl.
instance: ""
# Escape hatches, both blank by default: nameOverride replaces the "grafana-mcp"
# stem, fullnameOverride replaces the computed name outright.
nameOverride: ""
fullnameOverride: ""

image:
  repository: grafana/mcp-grafana
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1

# --- Required for the MCP server to reach Grafana ---
# Base URL of the Grafana instance (in-cluster DNS). Wired from the Grafana grain.
grafanaUrl: ""
# Service-account token minted by the Grafana blueprint. Wired from the Grafana grain.
serviceAccountToken: ""

# --- Server transport config ---
# streamable-http (recommended) or sse. stdio is not usable in k8s.
transport: "streamable-http"
# Port the MCP server listens on inside the pod and the Service exposes.
port: 8000
# The server binds this address. MUST be 0.0.0.0 (not localhost) to be reachable
# through a k8s Service — the mcp-grafana default of localhost:8000 only accepts
# in-pod loopback traffic.
bindAddress: "0.0.0.0"
# Extra Host header values to allow, comma-separated, ON TOP OF the in-cluster
# names the chart computes for itself (the Service's bare name and FQDN, each
# with and without the port - see templates/deployment.yaml). mcp-grafana
# defaults to loopback-only and rejects any request whose Host isn't
# localhost/127.0.0.1, including traffic arriving via Service DNS, so the
# computed entries are what make the in-cluster endpoint reachable at all.
#
# What belongs here is the client side: the check matches the FULL Host header,
# which INCLUDES the port when a client dials a non-default one, so a
# `kubectl port-forward ... 8001:8000` client sends Host `localhost:8001` and
# needs that exact port-qualified variant listed. The Torque blueprint rewrites
# this from its local_port input; the default below covers a straight 8000:8000
# forward.
extraAllowedHosts: "localhost,127.0.0.1,localhost:8000,127.0.0.1:8000"
# Path the streamable-http/sse endpoint is served on. Pinned so it's deterministic
# across image builds (the latest/devel build defaults this to /mcp).
endpointPath: "/mcp"

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
