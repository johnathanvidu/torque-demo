apiVersion: v1
kind: Service
metadata:
  # Name carries the instance suffix, so several releases can share a namespace
  # and each still gets its own deterministic DNS record:
  #   http://<chart>-<instance>.<namespace>.svc.cluster.local:<port>/
  # The blueprint's mcp_endpoint output builds the same string.
  name: {{ include "github-mcp.fullname" . }}
  labels:
    {{- include "github-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "github-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
