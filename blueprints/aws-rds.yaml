spec_version: 2
description: Provision an Amazon RDS database (PostgreSQL or MySQL) in an existing VPC, with the master password generated and stored in AWS Secrets Manager.

metadata:
  self-service: true
  display-name: AWS RDS Database
  icon:
    path: icons/postgres.svg

inputs:
  agent:
    type: agent
    description: Torque agent used to run the Terraform grain.
  name:
    type: string
    default: torque-rds
    pattern: '^[a-z][a-z0-9-]{0,40}$'
    validation-description: Lowercase letters, digits and hyphens, starting with a letter (max 41 characters).
    description: >-
      Base name for the RDS instance, subnet group and security group. The environment id is
      appended to it, so the same base name can be deployed many times side by side.
  vpc_id:
    type: string
    description: VPC in which to create the database security group.
  subnet_ids:
    type: string
    description: 'Subnet IDs for the DB subnet group, as an HCL list (e.g. ["subnet-123","subnet-456"]). Must span at least two availability zones.'
  engine:
    type: string
    default: postgres
    allowed-values:
      - postgres
      - mysql
    description: Database engine.
  instance_class:
    type: string
    default: db.t3.micro
    description: RDS instance class.
  allocated_storage:
    type: string
    default: "20"
    description: Allocated storage in GiB.
  db_name:
    type: string
    default: appdb
    description: Name of the initial database to create.
  username:
    type: string
    default: dbadmin
    description: Master username. The password is generated by RDS and stored in Secrets Manager.
  multi_az:
    type: string
    default: "false"
    allowed-values:
      - "true"
      - "false"
    description: Deploy a standby instance in a second availability zone.
  allowed_cidr_blocks:
    type: string
    default: "[]"
    description: CIDR blocks allowed to reach the database port, as an HCL list. Leave as [] to allow the whole VPC CIDR.

outputs:
  db_host:
    value: '{{ .grains.rds.outputs.db_host }}'
  db_port:
    value: '{{ .grains.rds.outputs.db_port }}'
  db_name:
    value: '{{ .grains.rds.outputs.db_name }}'
  db_instance_identifier:
    value: '{{ .grains.rds.outputs.db_instance_identifier }}'
  master_user_secret_arn:
    value: '{{ .grains.rds.outputs.master_user_secret_arn }}'
  security_group_id:
    value: '{{ .grains.rds.outputs.security_group_id }}'

grains:
  rds:
    kind: terraform
    spec:
      source:
        store: torque-demo
        path: terraform/aws/rds
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        # The DB identifier, subnet group and security group names are all
        # account/region-scoped, so the environment id is appended to make each
        # deployment's names its own. envId is stable for the life of an
        # environment, so redeploying or updating never renames anything.
        - name: '{{ .inputs.name }}-{{ envId | downcase }}'
        - vpc_id: '{{ .inputs.vpc_id }}'
        - subnet_ids: '{{ .inputs.subnet_ids }}'
        - engine: '{{ .inputs.engine }}'
        - instance_class: '{{ .inputs.instance_class }}'
        - allocated_storage: '{{ .inputs.allocated_storage }}'
        - db_name: '{{ .inputs.db_name }}'
        - username: '{{ .inputs.username }}'
        - multi_az: '{{ .inputs.multi_az }}'
        - allowed_cidr_blocks: '{{ .inputs.allowed_cidr_blocks }}'
      outputs:
        - db_host
        - db_port
        - db_name
        - db_instance_identifier
        - master_user_secret_arn
        - security_group_id
