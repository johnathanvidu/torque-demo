spec_version: 2
description: Deploy a Grafana MCP server that gives AI agents live access to Grafana observability - query Prometheus metrics and Loki logs, search and manage dashboards, and inspect alerts, incidents, and datasources. Can be launched many times against the same cluster - every deployment names its resources after the environment id.

metadata:
  self-service: true
  display-name: Grafana MCP Server
  icon:
    path: icons/grafana.svg
  blueprint-labels:
    - key: type
      value: mcp

# Only a handful of inputs - everything else (image tag, transport, port,
# endpoint path, namespace) is fixed and lives in helm/grafana-mcp/values.yaml.
inputs:
  agent:
    type: agent
    description: Kubernetes agent that runs the Helm grain (same cluster as Grafana).
  # ---- Wired dynamically from the Grafana blueprint (not entered by the user) ----
  grafana_url:
    type: string
    description: In-cluster base URL of Grafana, e.g. http://grafana-abc123.grafana.svc.cluster.local:3000. Wired from the Grafana grain output.
  service_account_token:
    type: string
    sensitive: true
    description: Grafana service-account token the MCP server authenticates with. Minted at deploy time and wired from the Grafana grain output.
  local_port:
    type: string
    default: '8000'
    description: >-
      Local port the claude_cli_setup output's port-forward binds to. The cluster
      side is always 8000; this is only the laptop side, and it is the one thing
      that still collides when two of these environments are tunnelled at once —
      give the second one 8001, and so on. It is also added to the server's Host
      allowlist, which mcp-grafana matches including the port.

outputs:
  # In-cluster endpoint of the MCP server, for other in-cluster clients / agents.
  #
  # The environment id is part of the Service name (see the instance input on the
  # grain below), which is what lets several of these environments share the "mcp"
  # namespace without their Deployments, Services, Secrets, and labels colliding.
  mcp_endpoint:
    value: 'http://grafana-mcp-{{ envId | downcase }}.mcp.svc.cluster.local:8000/mcp'
  # One command to use the server from the Claude CLI: register it (-s user = global
  # scope, works from any directory), then hold the port-forward tunnel open in the
  # foreground (Ctrl+C to stop).
  #
  # The registration name carries the environment id too: `claude mcp add` is
  # keyed by name at user scope, so a fixed "grafana-mcp" would have the second
  # environment silently overwrite the first environment's entry.
  claude_cli_setup:
    value: 'claude mcp add -s user --transport http grafana-mcp-{{ envId | downcase }} http://localhost:{{ .inputs.local_port }}/mcp && kubectl port-forward svc/grafana-mcp-{{ envId | downcase }} -n mcp {{ .inputs.local_port }}:8000'
  # Unregister the MCP server from the Claude CLI (stop the port-forward separately).
  claude_mcp_delete_command:
    value: 'claude mcp remove -s user grafana-mcp-{{ envId | downcase }}'

grains:
  grafana-mcp:
    kind: helm
    spec:
      source:
        store: torque-demo
        path: helm/grafana-mcp
      agent:
        name: '{{ .inputs.agent }}'
      # Shared namespace on purpose: every MCP server from this repo lands in
      # "mcp", so one `kubectl get pods -n mcp` shows them all. Isolation comes
      # from the per-resource instance suffix below, not from the namespace.
      target-namespace: mcp
      command-arguments: '--create-namespace --wait --timeout 3m'
      inputs:
        # Suffixes every object the chart creates (Deployment, Service, Secret,
        # labels) with the environment id, so a second environment deploying into
        # the same namespace doesn't hit Helm's "invalid ownership metadata" error
        # or end up with two Services selecting the same pods. The chart also
        # derives its in-cluster --allowed-hosts entries from this, and the DNS
        # names in the outputs above are kept in sync with it by hand.
        - instance: '{{ envId | downcase }}'
        - grafanaUrl: '{{ .inputs.grafana_url }}'
        - serviceAccountToken: '{{ .inputs.service_account_token }}'
        # Client-side Host values, on top of the in-cluster names the chart
        # computes. mcp-grafana matches the full Host header including the port,
        # so a port-forward on anything other than 8000 is rejected unless the
        # port-qualified form is listed here.
        - extraAllowedHosts: 'localhost,127.0.0.1,localhost:{{ .inputs.local_port }},127.0.0.1:{{ .inputs.local_port }}'
