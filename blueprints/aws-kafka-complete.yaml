spec_version: 2
description: Deploy AWS MSK from scratch and the Kafka demo app (producer, consumer, and a live dashboard) on an EC2 instance that connects to MSK over IAM.

labels:
  - AWS
  - kafka

metadata:
  self-service: true
  display-name: AWS MSK (Kafka) Complete
  icon:
    path: icons/kafka.svg

inputs:
  prefix:
    type: string
    default: kafka-demo
    description: >-
      Base name applied to all resources in this environment. Each grain appends the
      environment id to it, so this blueprint can be launched many times concurrently
      without the deployments colliding — see the resource_prefix output for the name
      an individual environment actually used.
  region:
    type: string
    default: eu-west-1
    description: AWS region for the app runtime configuration.
  fail_on_unhealthy:
    type: string
    default: 'true'
    allowed-values:
      - 'true'
      - 'false'
    description: >-
      When true, an unhealthy pipeline fails the health_check grain, so the environment
      itself goes "Active with Error" rather than sitting green while carrying a BROKEN
      output. Set to false to keep the environment Active and treat the outputs as the
      only signal.

outputs:
  dashboard_url:
    value: '{{ .grains.app.outputs.dashboard_url }}'
    kind: link
  # The prefix this particular environment's AWS resources are named with
  # (<prefix>-<environment id>). The string to search on in the console, and the
  # value any ad-hoc script must be pointed at instead of a bare "kafka-demo".
  resource_prefix:
    value: '{{ .grains.app.outputs.name_prefix }}'
    quick: true
  # The live verdict. Re-run the health_check grain (or the kafka-health-check
  # workflow) to refresh these without touching the infrastructure grains.
  #
  # Symptom only: these report that the pipeline has stopped and what that looks
  # like from outside, not why.
  kafka_health:
    value: '{{ .grains.health_check.activities.deploy.commands.check.outputs.kafka_health }}'
    quick: true
  health_summary:
    value: '{{ .grains.health_check.activities.deploy.commands.check.outputs.health_summary }}'
    quick: true
  messages_processed:
    value: '{{ .grains.health_check.activities.deploy.commands.check.outputs.messages_processed }}'

grains:
  vpc:
    kind: blueprint
    spec:
      source:
        store: torque-demo
        path: blueprints/aws-vpc.yaml
      inputs:
        - agent: vido-vido-prod
        - name: '{{ .inputs.prefix }}-vpc'
        - cidr_block: 10.7.0.0/16
      outputs:
        - vpc_id
        - vpc_cidr_block
        - subnet_id

  kafka:
    kind: blueprint
    depends-on: vpc
    spec:
      source:
        store: torque-demo
        path: blueprints/aws-msk.yaml
      inputs:
        - agent: vido-vido-prod
        - name: '{{ .inputs.prefix }}'
        - vpc_id: '{{ .grains.vpc.outputs.vpc_id }}'
        - vpc_cidr_block: '{{ .grains.vpc.outputs.vpc_cidr_block }}'
        - topic_name: orders
      outputs:
        - bootstrap_brokers
        - cluster_arn
        - topic_name
        # Handed to the health check so it probes this environment's broker SG by
        # id, rather than looking one up by name across the whole account.
        - broker_security_group_id

  app:
    kind: blueprint
    depends-on: vpc, kafka
    spec:
      source:
        store: torque-demo
        path: blueprints/aws-kafka-app.yaml
      inputs:
        - agent: vido-vido-prod
        - name: '{{ .inputs.prefix }}'
        - region: '{{ .inputs.region }}'
        - vpc_id: '{{ .grains.vpc.outputs.vpc_id }}'
        - subnet_id: '{{ .grains.vpc.outputs.subnet_id }}'
        - bootstrap_brokers: '{{ .grains.kafka.outputs.bootstrap_brokers }}'
        - cluster_arn: '{{ .grains.kafka.outputs.cluster_arn }}'
        - topic_name: '{{ .grains.kafka.outputs.topic_name }}'
      outputs:
        - name_prefix
        - dashboard_url
        - instance_id
        # Same reasoning as broker_security_group_id above: the health check reads the
        # exact parameter this environment created, not a path it reassembled.
        - consumer_topic_param

  # The pipeline's verdict, as environment state. Everything above proves the
  # infrastructure exists; this proves data is actually flowing through it.
  #
  # Safe to re-run on its own: it only reads (describe / get-parameter / a cat
  # over SSM), so re-running it costs nothing and mutates nothing. That is what
  # the kafka-health-check workflow does on a schedule.
  health_check:
    kind: shell
    depends-on: vpc, kafka, app
    spec:
      agent:
        name: vido-vido-prod
      files:
        - source: torque-demo
          path: scripts/health-check.sh
      env-vars:
        - AWS_DEFAULT_REGION: '{{ .inputs.region }}'
        # Every subject of the check is identified by a value this environment
        # produced, never by a name rebuilt from the prefix — so several of these
        # environments can run side by side and each health check still reads its own.
        - BROKER_SG_ID: '{{ .grains.kafka.outputs.broker_security_group_id }}'
        - TOPIC_PARAM: '{{ .grains.app.outputs.consumer_topic_param }}'
        # The topic the producer writes, wired straight from the MSK grain.
        - EXPECTED_TOPIC: '{{ .grains.kafka.outputs.topic_name }}'
        - VPC_CIDR: '{{ .grains.vpc.outputs.vpc_cidr_block }}'
        - INSTANCE_ID: '{{ .grains.app.outputs.instance_id }}'
        - FAIL_ON_UNHEALTHY: '{{ .inputs.fail_on_unhealthy }}'
      activities:
        deploy:
          commands:
            # Sourced, not executed, so the script's exports become grain outputs.
            - name: check
              command: source health-check.sh
              outputs:
                - kafka_health
                - health_summary
                - messages_processed
